name: Run Renovate
description: Run a pinned Renovate CLI for the caller repository with optional APM tooling
inputs:
  token:
    description: Repository-scoped GitHub-only bot token
    required: true
  dry-run:
    description: Use full for a non-writing preview or an empty string for normal operation
    default: full
  renovate-version:
    description: Exact Renovate version
    default: 44.151.0
  apm-version:
    description: Optional exact APM version for consumers with versioned APM lockfiles
    default: ''
runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        BOT_TOKEN: ${{ inputs.token }}
        BOT_VERSION: ${{ inputs.renovate-version }}
        APM_VERSION: ${{ inputs.apm-version }}
        PREVIEW: ${{ inputs.dry-run }}
      run: |
        test -n "$BOT_TOKEN" || { echo 'Configure a repository-scoped GitHub-only bot token.' >&2; exit 1; }
        [[ "$BOT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Renovate requires an exact version.' >&2; exit 1; }
        [[ -z "$APM_VERSION" || "$APM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'APM requires an exact version.' >&2; exit 1; }
        [[ -z "$PREVIEW" || "$PREVIEW" == full ]] || { echo 'dry-run must be full or empty.' >&2; exit 1; }
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.21.0
    - if: inputs.apm-version != ''
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: 0.13.5
        enable-cache: false
    - name: Install optional APM CLI
      if: inputs.apm-version != ''
      shell: bash
      env:
        APM_VERSION: ${{ inputs.apm-version }}
        UV_TOOL_DIR: ${{ runner.temp }}/delivery-tooling/uv-tools
        UV_TOOL_BIN_DIR: ${{ runner.temp }}/delivery-tooling/bin
      run: |
        uv tool install "apm-cli==$APM_VERSION"
        echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"
    - name: Run Renovate
      shell: bash
      env:
        BOT_VERSION: ${{ inputs.renovate-version }}
        RENOVATE_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ inputs.token }}
        RENOVATE_PLATFORM: github
        RENOVATE_REPOSITORIES: ${{ github.repository }}
        RENOVATE_AUTODISCOVER: 'false'
        RENOVATE_ONBOARDING: 'false'
        RENOVATE_REQUIRE_CONFIG: required
        RENOVATE_BINARY_SOURCE: global
        RENOVATE_DRY_RUN: ${{ inputs.dry-run }}
        LOG_LEVEL: info
      run: npx --yes --package="renovate@$BOT_VERSION" renovate
