name: Run Renovate
description: Run a pinned Renovate CLI for the caller repository with optional APM tooling
inputs:
  token:
    description: Repository-scoped GitHub-only bot token
    required: true
  dry-run:
    description: Use full for a non-writing preview or an empty string for normal operation
    default: full
  renovate-version:
    description: Exact Renovate version
    default: 44.151.0
  apm-version:
    description: Optional exact APM version for consumers with versioned APM lockfiles
    default: ''
runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        RENOVATE_TOKEN: ${{ inputs.token }}
        BOT_VERSION: ${{ inputs.renovate-version }}
        APM_VERSION: ${{ inputs.apm-version }}
        RENOVATE_DRY_RUN: ${{ inputs.dry-run }}
        CALLER_REPOSITORY: ${{ github.repository }}
      run: bash "$ACTION_PATH/run.sh" --check
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.21.0
    - if: inputs.apm-version != ''
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: 0.13.5
        enable-cache: false
    - name: Install optional APM CLI
      if: inputs.apm-version != ''
      shell: bash
      env:
        APM_VERSION: ${{ inputs.apm-version }}
        UV_TOOL_DIR: ${{ runner.temp }}/delivery-tooling/uv-tools
        UV_TOOL_BIN_DIR: ${{ runner.temp }}/delivery-tooling/bin
      run: |
        uv tool install "apm-cli==$APM_VERSION"
        echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"
    - name: Run Renovate
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BOT_VERSION: ${{ inputs.renovate-version }}
        APM_VERSION: ${{ inputs.apm-version }}
        RENOVATE_TOKEN: ${{ inputs.token }}
        CALLER_REPOSITORY: ${{ github.repository }}
        RENOVATE_DRY_RUN: ${{ inputs.dry-run }}
      run: bash "$ACTION_PATH/run.sh"
