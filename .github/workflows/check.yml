name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.8
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - run: make setup check
  plan:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    outputs:
      release: ${{ steps.plan.outputs.release }}
      source-commit: ${{ steps.plan.outputs.source-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./actions/release-plan
        id: plan
      - uses: ./actions/release-verify
        if: steps.plan.outputs.release == 'true'
        with:
          plan: ${{ steps.plan.outputs.plan }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.release == 'true'
        with:
          name: release-${{ github.sha }}
          path: build/release/
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source-commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: build/release/
      - uses: ./actions/release-publish
        with:
          token: ${{ github.token }}
          plan: build/release/release-plan.json
          manifest: build/release/release-manifest.json
          expected-commit: ${{ needs.plan.outputs.source-commit }}
